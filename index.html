<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBUFC — Panel de Gestion du Fight Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=15">
  <link rel="stylesheet" href="css/ranked.css?v=15">
  <link rel="stylesheet" href="css/lock.css?v=15">
</head>
<body>

<div id="lock"></div>

<header class="topnav" id="topnav">
  <div class="nav-left">
    <a class="brand" href="#dashboard">
      <img src="assets/logo.png" alt="" class="brand-logo" onerror="this.classList.add('hide')">
      <span class="brand-name">PBUFC</span>
    </a>
    <button class="burger" id="burger">Menu</button>
    <nav class="menu" id="nav"></nav>
  </div>
  <div class="nav-actions">
    <button class="mini-btn" data-action="backups">Sauvegardes</button>
    <button class="mini-btn" data-action="export">Exporter</button>
    <button class="mini-btn" data-action="import">Importer</button>
    <button class="mini-btn danger" data-action="reset">Réinitialiser</button>
    <input type="file" id="import-file" accept=".json" hidden>
  </div>
</header>

<div class="pagebar">
  <h1 id="page-title">Tableau de bord</h1>
  <span class="pagebar-right">PBUFC — PlayBoy Underground Fight Club · RP</span>
</div>

<main class="view" id="view"></main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="js/store.js?v=15"></script>
<script src="js/app.js?v=15"></script>
<script src="js/lock.js?v=15"></script>
</body>
</html>
