<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <script>
    window.onerror = function (m, s, l, c) {
      try {
        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#7f1d1d;color:#fff;font:11px Consolas,monospace;padding:8px 12px;white-space:pre-wrap;border-bottom:2px solid #ef4444';
        d.textContent = 'ERREUR JS: ' + m + '  [' + String(s || '').split('/').pop() + ':' + l + ':' + c + ']';
        (document.body || document.documentElement).appendChild(d);
      } catch (e) { }
      return false;
    };
  </script>
  <title>PBUFC — Panel de Gestion du Fight Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=25">
  <link rel="stylesheet" href="css/ranked.css?v=25">
  <link rel="stylesheet" href="css/lock.css?v=25">
</head>
<body>

<div id="lock"></div>

<header class="topnav" id="topnav">
  <div class="nav-left">
    <a class="brand" href="#dashboard">
      <img src="assets/logo.png" alt="" class="brand-logo" onerror="this.classList.add('hide')">
      <span class="brand-name">PBUFC</span>
    </a>
    <button class="burger" id="burger">Menu</button>
    <nav class="menu" id="nav"></nav>
  </div>
  <div class="nav-actions">
    <span class="user-chip" id="user-chip" style="display:none"></span>
    <button class="mini-btn" id="btn-switch" data-action="switch-user" style="display:none">Changer d'utilisateur</button>
    <button class="mini-btn" data-action="backups">Sauvegardes</button>
    <button class="mini-btn" data-action="export">Exporter</button>
    <button class="mini-btn" data-action="import">Importer</button>
    <button class="mini-btn danger" data-action="reset">Réinitialiser</button>
    <input type="file" id="import-file" accept=".json" hidden>
  </div>
</header>

<div class="pagebar">
  <h1 id="page-title">Tableau de bord</h1>
  <span class="pagebar-right">PBUFC — PlayBoy Underground Fight Club · RP</span>
</div>

<main class="view" id="view"></main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="js/store.js?v=25"></script>
<script src="js/app.js?v=25"></script>
<script src="js/lock.js?v=25"></script>
</body>
</html>
